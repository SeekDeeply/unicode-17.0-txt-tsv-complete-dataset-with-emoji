name: probe-write-capabilities

# Throwaway diagnostic: tells apart the two different reasons a write can fail.
#   * 403 "Resource not accessible by integration"  -> the workflow is missing that
#     permission scope; fix it in `permissions:`
#   * "not permitted to create or approve pull requests" -> a repository setting;
#     no amount of permissions here will change it
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Can we create an issue?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh issue create --title "probe: issue creation works" --body "Diagnostic from probe-write-capabilities. Safe to close." 2>&1 | tee out.txt; then
            echo "ISSUE_OK"
            gh issue close --comment "probe: closing immediately" $(grep -oE 'https://[^ ]+' out.txt | tail -1) || true
          else
            echo "ISSUE_FAIL"; cat out.txt
          fi

      - name: Can we create a pull request?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b probe/pr-test
          date > probe.txt
          git add probe.txt && git commit -m "probe: pr capability"
          git push origin HEAD:probe/pr-test
          if gh pr create --title "probe: pr creation works" --body "Diagnostic. Safe to close." --base main --head probe/pr-test 2>&1 | tee pr.txt; then
            echo "PR_OK"
          else
            echo "PR_FAIL"; cat pr.txt
          fi
