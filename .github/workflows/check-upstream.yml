name: auto-adopt new Unicode release

# The automated-collection heartbeat, end to end.
#
# Weekly (and on demand) it asks unicode.org whether a newer *released* version
# exists. If so it adopts it fully - repin, rename directories, re-download every
# source, rebuild, run the strict verifier, re-render the docs - and commits the
# result to main.
#
# Two deliberate choices:
#
#   * By default it commits straight to main, so the mirror stays current without
#     anyone in the loop. That is safe because the commit is only reached after
#     src/bump-version.mjs has rebuilt every file from freshly downloaded sources and
#     src/verify.mjs --strict has passed against them; a failed verification aborts
#     before git add. Set mode=pr to get a reviewable pull request instead.
#   * It refuses draft versions. /Public/19.0.0/ redirects to /Public/draft/ and is
#     not released; src/bump-version.mjs treats any redirect as "not released".
on:
  schedule:
    # Mondays 06:17 UTC. Unicode ships once a year in September; weekly is cheap
    # and means a fresh release is adopted within days without polling pressure.
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'Specific UCD version to adopt (e.g. 18.0.0). Empty = latest released.'
        required: false
      dry_run:
        description: 'Only report what would change; write nothing.'
        type: boolean
        default: false
      mode:
        description: 'How to land the change: push (commit straight to main) or pr (open a pull request).'
        type: choice
        options: ['push', 'pr']
        default: 'push'

permissions:
  # contents: write  - push the adopted dataset to main
  # issues: write    - report a failed adoption, and announce when a PR cannot be
  #                    opened. WITHOUT this, POST /issues returns 403
  #                    "Resource not accessible by integration", which reads like a
  #                    repository-settings problem and is not: the default
  #                    GITHUB_TOKEN is read-only, so every write scope has to be
  #                    requested explicitly here.
  # pull-requests: write - only needed for mode=pr, and only on repositories whose
  #                    settings permit Actions to open pull requests.
  contents: write
  issues: write
  pull-requests: write

# Never run two adoptions at once: both would try to rename the same directories.
concurrency:
  group: auto-adopt
  cancel-in-progress: false

jobs:
  adopt:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check for a newer release
        id: check
        # Transient workflow files live under .work/ (gitignored) so that `git add -A`
        # in the landing step can never publish a scratch file into the dataset repo.
        # That mistake happened once: check.txt and pr-body.md were committed.
        run: |
          mkdir -p .work
          node src/check-upstream-version.mjs --github | tee .work/check.txt

      - name: Summarize the check
        run: |
          {
            echo '### Unicode release check'
            echo
            grep -E '^(update|latest_ucd|latest_emoji|pinned_ucd|pinned_emoji)=' .work/check.txt | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Decide whether to adopt
        id: decide
        env:
          UPDATE: ${{ steps.check.outputs.update }}
          LATEST: ${{ steps.check.outputs.latest_ucd }}
          REQUESTED: ${{ inputs.version }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          TARGET=""
          if [ -n "${REQUESTED:-}" ]; then
            TARGET="$REQUESTED"
            echo "Adopting the explicitly requested version: $TARGET"
          elif [ "${UPDATE:-false}" = "true" ]; then
            TARGET="$LATEST"
            echo "A newer release was detected: $TARGET"
          else
            echo "Pinned version is current; nothing to do."
          fi
          # Normalise everything through step outputs.
          #
          # `inputs.dry_run` is a *boolean* input, and a boolean true does not equal the
          # string 'true' in an `if:` expression - so `inputs.dry_run != 'true'` is true
          # and the step runs when it should not. That is exactly how the first dry run
          # wrote nothing and then failed trying to read the summary it never produced.
          # Step outputs are always strings, so compare against those instead.
          DRY_NORM="false"
          if [ "${DRY:-false}" = "true" ]; then DRY_NORM="true"; fi
          echo "dry=$DRY_NORM" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          if [ -n "$TARGET" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi

      - name: Adopt the new version
        if: steps.decide.outputs.go == 'true'
        env:
          TARGET: ${{ steps.decide.outputs.target }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${DRY:-false}" = "true" ]; then
            node src/bump-version.mjs --to "$TARGET" --dry-run
          else
            node src/bump-version.mjs --to "$TARGET"
          fi

      - name: Report what changed
        if: steps.decide.outputs.go == 'true' && steps.decide.outputs.dry == 'false'
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const s = JSON.parse(fs.readFileSync("data/bump-summary.json", "utf8"));
            const out = [];
            const row = (label, k) => {
              const c = s.counts[k];
              if (!c) return;
              const sign = c.change > 0 ? "+" : "";
              out.push("| " + label + " | " + c.before.toLocaleString("en-US") + " | " + c.after.toLocaleString("en-US") + " | " + sign + c.change.toLocaleString("en-US") + " |");
            };
            out.push("### Adopting Unicode " + s.to.ucd + " / Emoji " + s.to.emoji);
            out.push("");
            out.push("| | before | after | change |");
            out.push("|---|---:|---:|---:|");
            row("code points", "codePoints");
            row("blocks", "blocks");
            row("emoji sequences", "emojiSequences");
            row("fully-qualified", "fullyQualified");
            out.push("");
            out.push("Verification: **" + s.verification + "**");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join("\n") + "\n");
          '

      - name: Build the pull request body
        if: steps.decide.outputs.go == 'true' && steps.decide.outputs.dry == 'false'
        run: |
          set -euo pipefail
          mkdir -p .work
          node -e '
            const fs = require("fs");
            const s = JSON.parse(fs.readFileSync("data/bump-summary.json", "utf8"));
            const n = (v) => v.toLocaleString("en-US");
            const delta = (c) => c ? ((c.change > 0 ? "+" : "") + n(c.change)) : "n/a";
            const lines = [];
            lines.push("Adopts **Unicode " + s.to.ucd + "** (Emoji " + s.to.emoji + "), replacing " + s.from.ucd + " / " + s.from.emoji + ".");
            lines.push("");
            lines.push("Everything below was produced by `src/bump-version.mjs`; no data file was edited by hand.");
            lines.push("");
            lines.push("| | before | after | change |");
            lines.push("|---|---:|---:|---:|");
            if (s.counts.codePoints) lines.push("| code points | " + n(s.counts.codePoints.before) + " | " + n(s.counts.codePoints.after) + " | " + delta(s.counts.codePoints) + " |");
            if (s.counts.blocks) lines.push("| blocks | " + n(s.counts.blocks.before) + " | " + n(s.counts.blocks.after) + " | " + delta(s.counts.blocks) + " |");
            if (s.counts.emojiSequences) lines.push("| emoji sequences | " + n(s.counts.emojiSequences.before) + " | " + n(s.counts.emojiSequences.after) + " | " + delta(s.counts.emojiSequences) + " |");
            if (s.counts.fullyQualified) lines.push("| fully-qualified | " + n(s.counts.fullyQualified.before) + " | " + n(s.counts.fullyQualified.after) + " | " + delta(s.counts.fullyQualified) + " |");
            lines.push("");
            lines.push("## What the pipeline did");
            lines.push("");
            lines.push("1. Verified " + s.to.ucd + " is a **released** version (a redirect to `/Public/draft/` is rejected).");
            lines.push("2. Repinned `src/lib/sources.mjs`.");
            lines.push("3. `git mv` the output directories so history follows the files.");
            lines.push("4. Re-downloaded every source and re-pinned its SHA-256 in `data/sources.lock.json`.");
            lines.push("5. Rebuilt all files from those sources.");
            lines.push("6. Ran `src/verify.mjs --strict` - **" + s.verification + "**.");
            lines.push("7. Re-rendered the docs from the new manifest.");
            lines.push("");
            lines.push("## Reviewing this");
            lines.push("");
            lines.push("- The data diff is expected to be large; it is regenerated output, not edits.");
            lines.push("- What is worth checking: the counts above, and that `data/sources.lock.json` points at the new version.");
            lines.push("- `build & verify` runs on this PR and independently rebuilds from the pinned sources; if it is green, the committed bytes are reproducible.");
            lines.push("");
            lines.push("_Opened automatically by the weekly upstream check._");
            fs.writeFileSync(".work/pr-body.md", lines.join("\n") + "\n");
          '

      - name: Land the change
        if: steps.decide.outputs.go == 'true' && steps.decide.outputs.dry == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ steps.decide.outputs.target }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          BRANCH="auto/unicode-$TARGET"
          COMPARE_URL="https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
          LANDING="${MODE:-push}"
          echo "Landing mode: $LANDING"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Direct push is the default because the whole point is an unattended mirror.
          # The safety comes from bump-version.mjs, which refuses to finish unless
          # src/verify.mjs --strict passes against the freshly downloaded sources: the
          # commit is only ever reached by a dataset that already proved itself complete.
          if [ "$LANDING" = "push" ]; then
            git add -A
            git commit -m "data: adopt Unicode $TARGET" \
              -m "Regenerated by src/bump-version.mjs from the official UCD and Emoji sources;" \
              -m "src/verify.mjs --strict passed before this commit was made."
            git push origin HEAD:main
            echo "Pushed directly to main."
            {
              echo "### Adopted Unicode $TARGET"
              echo ""
              echo "Committed straight to \`main\` after strict verification passed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # PR mode: keep the branch for review.
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "data: adopt Unicode $TARGET" \
            -m "Regenerated by src/bump-version.mjs from the official UCD and Emoji sources." \
            -m "Verification passed; see the pull request body for the before/after counts."
          git push --force origin "$BRANCH"

          # GitHub refuses to let Actions open a pull request unless the repository enables
          # "Allow GitHub Actions to create and approve pull requests", and the same setting
          # gates issue creation. A workflow cannot grant it to itself, so a refusal is a
          # degraded mode, not a failure: the branch is pushed and the data is complete.
          if PR_URL=$(gh pr create --title "data: adopt Unicode $TARGET" --body-file .work/pr-body.md --base main --head "$BRANCH" 2>&1); then
            echo "Pull request created: $PR_URL"
            printf '### Pull request opened\n\n%s\n' "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::warning title=One manual click left::Branch $BRANCH is pushed and the dataset is fully regenerated and verified, but this repository does not allow GitHub Actions to open pull requests. Open it here: $COMPARE_URL"
          {
            echo "### Adopted Unicode $TARGET - branch pushed, pull request needs one click"
            echo ""
            echo "Open the pull request: $COMPARE_URL"
            echo ""
            echo "To let this workflow open it automatically: Settings -> Actions -> General ->"
            echo "Workflow permissions -> enable \"Allow GitHub Actions to create and approve pull requests\"."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Nothing to do
        if: steps.decide.outputs.go != 'true'
        run: echo 'No newer released version was found; the pin is current.'
